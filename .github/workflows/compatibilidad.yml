name: Compatibilidad de la interfaz en Windows
on: [push, pull_request]
jobs:
  interfaz:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m reconocimiento web --help
      - run: python -m unittest discover -s tests -p test_compatibilidad_python.py
